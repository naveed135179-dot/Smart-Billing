<!doctype html>
<html lang="en" data-theme="studio">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1">
<title>Ledgerly — Smart Business</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#202a27;--muted:#75807b;--line:#e7e9e3;--accent:#426b5b;--soft:#e9f0eb;--nav:#202d28;--shadow:0 10px 30px #1c302512;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;padding:24px 16px;background:var(--nav);color:#eaf0eb;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 27px;font-size:19px;font-weight:750;letter-spacing:-.5px}.brand-icon{height:36px;width:36px;border-radius:12px;background:#d2e3d8;color:#284638;display:grid;place-items:center;font-size:19px}.nav-label{padding:10px 12px 7px;color:#97a79d;text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#c5d0c9;text-align:left;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:14px 10px;color:#aab8af;font-size:12px;border-top:1px solid #ffffff20}.main{margin-left:248px;min-height:100vh}.topbar{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink);font-size:15px;margin-left:8px}.top-actions{display:flex;align-items:center;gap:12px}.today{color:var(--muted);font-size:12px}.avatar{height:35px;width:35px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700}.content{max-width:1420px;margin:auto;padding:30px 34px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.page-head h1{font-size:25px;letter-spacing:-.7px;margin:0 0 4px}.page-head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:#b44545}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:19px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{height:34px;width:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:16px}.stat-value{font-size:25px;letter-spacing:-.8px;font-weight:750;margin:12px 0 2px}.stat-foot{font-size:11px;color:var(--muted)}.two-col{grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr)}.section-title{font-size:15px;font-weight:700;margin:0 0 3px}.section-sub{font-size:12px;color:var(--muted);margin:0 0 17px}.bar-chart{height:190px;display:flex;align-items:flex-end;justify-content:space-around;gap:12px;padding:10px 5px 0;border-bottom:1px solid var(--line)}.bar-set{height:100%;display:flex;flex:1;align-items:flex-end;justify-content:center;gap:5px;position:relative}.bar{width:min(28px,38%);border-radius:6px 6px 0 0;background:var(--accent);opacity:.84;min-height:4px}.bar.alt{background:#d6b98c;opacity:.82}.bar-label{position:absolute;bottom:-24px;color:var(--muted);font-size:10px}.legend{display:flex;gap:18px;margin-top:35px;font-size:11px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--accent);margin-right:6px}.legend span+span:before{background:#d6b98c}.activity{display:grid;gap:0}.activity-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.activity-row:last-child{border:0}.activity-name{font-weight:600}.activity-meta{font-size:11px;color:var(--muted)}.amount{font-weight:700}.pill{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:10px;font-weight:700;background:var(--soft);color:var(--accent)}.pill.warn{background:#fff1df;color:#a5671e}.pill.red{background:#fdeaea;color:#ad4747}.table-card{padding:0;overflow:hidden}.table-tools{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.search{border:1px solid var(--line);background:var(--bg);padding:8px 11px;border-radius:9px;width:230px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;background:color-mix(in srgb,var(--bg) 60%,var(--panel));padding:12px 18px;white-space:nowrap}td{padding:13px 18px;border-top:1px solid var(--line);font-size:12px;white-space:nowrap}td strong{font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.low{color:#b44545;font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 11px;outline:none}.field textarea{min-height:80px;resize:vertical}.modal-back{position:fixed;inset:0;background:#111a17a3;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;padding:23px;box-shadow:0 25px 90px #0004}.modal h2{margin:0 0 5px;font-size:19px}.modal .hint{color:var(--muted);font-size:12px;margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.theme-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.theme-option{border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;background:var(--panel)}.theme-option.selected{border:2px solid var(--accent)}.swatches{display:flex;gap:5px;margin-bottom:9px}.swatch{height:22px;flex:1;border-radius:6px}.theme-option strong{font-size:12px}.theme-option small{display:block;color:var(--muted);font-size:10px}.report-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.settings-grid{grid-template-columns:1fr 1fr}.menu-btn{display:none}.toast{position:fixed;bottom:22px;right:22px;background:#20372c;color:white;border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);z-index:50;animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.hint-box{background:var(--soft);border-radius:12px;padding:14px;color:var(--accent);font-size:12px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
[data-theme="terracotta"]{--bg:#f7f1ed;--panel:#fffdfa;--ink:#382a25;--muted:#88766e;--line:#eadfd8;--accent:#b45e42;--soft:#f5e7df;--nav:#3c2923}[data-theme="coastal"]{--bg:#eff5f5;--panel:#fff;--ink:#24343a;--muted:#70868d;--line:#dce7e8;--accent:#397d88;--soft:#e0f0f0;--nav:#203b43}[data-theme="midcentury"]{--bg:#f5f2e9;--panel:#fffdf6;--ink:#343127;--muted:#817b69;--line:#e6e1d3;--accent:#9a7840;--soft:#f3ecd9;--nav:#343127}[data-theme="minimal"]{--bg:#f5f6f7;--panel:#fff;--ink:#20242a;--muted:#737b84;--line:#e5e8eb;--accent:#4b6176;--soft:#eaf0f5;--nav:#252b33}
@media(max-width:1000px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.2s;width:250px}.sidebar.open{transform:none;box-shadow:0 0 0 100vmax #0006}.main{margin-left:0}.topbar{height:62px;padding:0 16px}.menu-btn{display:inline-flex}.content{padding:22px 15px 45px}.page-head{align-items:flex-start}.page-head h1{font-size:22px}.today{display:none}.stats{gap:10px}.card{padding:15px}.stat-value{font-size:21px}.report-cards,.settings-grid{grid-template-columns:1fr}.theme-list{grid-template-columns:repeat(2,1fr)}.table-tools{align-items:flex-start;flex-direction:column}.search{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">▦</div>Ledgerly</div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav><div class="side-bottom">Simple books. Clear decisions.<br>Everything saved on this device.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn menu-btn" onclick="toggleMenu()">☰</button><div class="crumb">Workspace <strong id="crumb">Overview</strong></div></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar">B</div></div></header><section class="content" id="view"></section></main></div><div id="overlay"></div><script>
const KEY='ledgerly-smart-billing-v1';const navItems=[['dashboard','⌂','Overview'],['invoices','▤','Invoices & estimates'],['products','◈','Products & stock'],['customers','♙','Customers'],['suppliers','♧','Suppliers'],['purchases','▣','Purchases'],['expenses','↗','Expenses'],['reports','▥','Reports'],['settings','⚙','Settings']];
const initial={business:{name:'Your Business',currency:'₹',tax:18},theme:'studio',customers:[{id:1,name:'Aarav Design Studio',phone:'+91 98765 43210',email:'accounts@aarav.example',balance:12800},{id:2,name:'Meera Homeworks',phone:'+91 98220 11223',email:'meera@example.test',balance:5400},{id:3,name:'Northside Cafe',phone:'+91 99881 22334',email:'hello@northside.example',balance:0}],suppliers:[{id:1,name:'Brightline Wholesale',phone:'+91 98100 12233',balance:0},{id:2,name:'Craft & Co.',phone:'+91 98770 55443',balance:7600}],products:[{id:1,name:'Pendant light — Sora',sku:'LGT-104',category:'Lighting',price:4850,stock:18,unit:'pcs'},{id:2,name:'Oak side table',sku:'FUR-208',category:'Furniture',price:12900,stock:7,unit:'pcs'},{id:3,name:'Linen cushion set',sku:'TEX-031',category:'Textiles',price:1650,stock:42,unit:'set'},{id:4,name:'Ceramic vase — Form',sku:'DEC-052',category:'Decor',price:2200,stock:3,unit:'pcs'}],invoices:[{id:1004,kind:'Invoice',party:'Aarav Design Studio',date:todayISO(),due:todayISO(),total:28320,status:'Paid'},{id:1003,kind:'Invoice',party:'Meera Homeworks',date:todayISO(),due:todayISO(),total:15222,status:'Pending'},{id:1002,kind:'Estimate',party:'Northside Cafe',date:todayISO(),due:todayISO(),total:9700,status:'Draft'}],purchases:[{id:204,party:'Brightline Wholesale',date:todayISO(),total:18200,status:'Received'}],expenses:[{id:301,name:'Studio utilities',category:'Utilities',date:todayISO(),amount:4200},{id:302,name:'Local delivery',category:'Transport',date:todayISO(),amount:1250}],payments:[]};let db=load();let page='dashboard';
function todayISO(){return new Date().toISOString().slice(0,10)}function load(){try{return {...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function fmt(n){return (db.business.currency||'₹')+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function niceDate(x){return x?new Date(x+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—'}function setTheme(){document.documentElement.dataset.theme=db.theme||'studio'}function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}function toggleMenu(){document.querySelector('.sidebar').classList.toggle('open')}
document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});setTheme();render();
function render(){document.getElementById('nav').innerHTML=navItems.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');document.getElementById('crumb').textContent=navItems.find(x=>x[0]===page)?.[2]||'Overview';document.getElementById('view').innerHTML=views[page]();document.querySelector('.sidebar').classList.remove('open')}
function go(p){page=p;render();window.scrollTo(0,0)}function head(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}function stat(label,val,ico,note){return `<article class="card"><div class="stat-top">${label}<span class="stat-icon">${ico}</span></div><div class="stat-value">${val}</div><div class="stat-foot">${note}</div></article>`}function table(headers,rows){return `<div class="card table-card"><div class="table-tools"><span class="section-title">Recent records</span><input class="search" placeholder="Search records…" oninput="filterTable(this)"></div><div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">Nothing here yet. Add your first record to get started.</td></tr>`}</tbody></table></div></div>`}function rowStatus(s){return `<span class="pill ${s==='Pending'||s==='Draft'?'warn':s==='Overdue'?'red':''}">${esc(s)}</span>`}function filterTable(el){let q=el.value.toLowerCase();el.closest('.table-card').querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function trend(){let labels=['Jun','Jul','Aug','Sep','Oct','Nov'];let amounts=[45,62,54,76,68,95];return `<div class="bar-chart">${labels.map((x,i)=>`<div class="bar-set"><div class="bar" style="height:${amounts[i]}%"></div><div class="bar alt" style="height:${Math.max(12,amounts[i]*.57)}%"></div><span class="bar-label">${x}</span></div>`).join('')}</div><div class="legend"><span>Sales</span><span>Expenses</span></div>`}
const views={dashboard:()=>{let sales=db.invoices.filter(x=>x.kind==='Invoice').reduce((a,x)=>a+x.total,0);let pending=db.invoices.filter(x=>x.status==='Pending').reduce((a,x)=>a+x.total,0);let low=db.products.filter(x=>x.stock<5).length;return `${head('Good ${greeting()}, '+esc(db.business.name),'Here’s what’s happening with your business today.',`<button class="btn primary" onclick="openForm('invoice')">＋ New invoice</button>`)}<div class="grid stats">${stat('Sales recorded',fmt(sales),'↗','From invoices in your books')}${stat('Payments to follow up',fmt(pending),'◷','Across pending invoices')}${stat('Customers',db.customers.length,'♙','In your contact book')}${stat('Low stock items',low,'◈',low?'Needs a quick restock':'Stock levels look good')}</div><div class="grid two-col"><article class="card"><div class="section-title">Business pulse</div><div class="section-sub">A quick view of your sales and expenses</div>${trend()}</article><article class="card"><div class="section-title">Recent activity</div><div class="section-sub">Your latest invoices and estimates</div><div class="activity">${db.invoices.slice(0,4).map(x=>`<div class="activity-row"><div><div class="activity-name">${esc(x.party)}</div><div class="activity-meta">${x.kind} · ${niceDate(x.date)}</div></div><div style="text-align:right"><div class="amount">${fmt(x.total)}</div>${rowStatus(x.status)}</div></div>`).join('')||'<div class="empty">No invoices yet.</div>'}</div></article></div><div class="quick"><button class="btn" onclick="openForm('estimate')">＋ Create estimate</button><button class="btn" onclick="openForm('product')">＋ Add product</button><button class="btn" onclick="openForm('expense')">＋ Record expense</button></div>`},
invoices:()=>`${head('Invoices & estimates','Create, track and follow up on your customer documents.',`<button class="btn primary" onclick="openForm('invoice')">＋ New invoice</button> <button class="btn" onclick="openForm('estimate')">＋ Estimate</button>`)}${table(['NUMBER','TYPE','CUSTOMER','DATE','TOTAL','STATUS'],db.invoices.map(x=>`<tr><td><strong>#INV-${x.id}</strong></td><td>${esc(x.kind)}</td><td>${esc(x.party)}</td><td>${niceDate(x.date)}</td><td><strong>${fmt(x.total)}</strong></td><td>${rowStatus(x.status)}</td></tr>`).join(''))}`,
products:()=>`${head('Products & stock','Keep your catalog, pricing and stock levels up to date.',`<button class="btn primary" onclick="openForm('product')">＋ Add product</button>`)}<div class="grid stats">${stat('Catalog items',db.products.length,'◈','Products and services')}${stat('Inventory value',fmt(db.products.reduce((a,x)=>a+x.price*x.stock,0)),'▣','At listed sale prices')}${stat('Low stock',db.products.filter(x=>x.stock<5).length,'⚠','Below 5 units')}</div>${table(['ITEM','SKU','CATEGORY','PRICE','IN STOCK','UNIT'],db.products.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.sku||'—')}</td><td>${esc(x.category||'General')}</td><td>${fmt(x.price)}</td><td class="${x.stock<5?'low':''}">${x.stock}</td><td>${esc(x.unit||'pcs')}</td></tr>`).join(''))}`,
customers:()=>`${head('Customers','Manage customer contacts and outstanding balances.',`<button class="btn primary" onclick="openForm('customer')">＋ Add customer</button>`)}${table(['CUSTOMER','PHONE','EMAIL','OUTSTANDING'],db.customers.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${fmt(x.balance)}</td></tr>`).join(''))}`,
suppliers:()=>`${head('Suppliers','Your supplier directory and payable balances.',`<button class="btn primary" onclick="openForm('supplier')">＋ Add supplier</button>`)}${table(['SUPPLIER','PHONE','BALANCE'],db.suppliers.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.phone||'—')}</td><td>${fmt(x.balance)}</td></tr>`).join(''))}`,
purchases:()=>`${head('Purchases','Track supplier purchases and incoming stock.',`<button class="btn primary" onclick="openForm('purchase')">＋ Record purchase</button>`)}${table(['REFERENCE','SUPPLIER','DATE','TOTAL','STATUS'],db.purchases.map(x=>`<tr><td><strong>#PUR-${x.id}</strong></td><td>${esc(x.party)}</td><td>${niceDate(x.date)}</td><td>${fmt(x.total)}</td><td>${rowStatus(x.status)}</td></tr>`).join(''))}`,
expenses:()=>`${head('Expenses','Record operating costs and keep an eye on spending.',`<button class="btn primary" onclick="openForm('expense')">＋ Add expense</button>`)}<div class="grid stats">${stat('Recorded expenses',fmt(db.expenses.reduce((a,x)=>a+x.amount,0)),'↗','All saved expense entries')}</div>${table(['DESCRIPTION','CATEGORY','DATE','AMOUNT'],db.expenses.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.category)}</td><td>${niceDate(x.date)}</td><td>${fmt(x.amount)}</td></tr>`).join(''))}`,
reports:()=>{let total=db.invoices.filter(x=>x.kind==='Invoice').reduce((a,x)=>a+x.total,0),paid=db.invoices.filter(x=>x.status==='Paid').reduce((a,x)=>a+x.total,0),outstanding=db.invoices.filter(x=>x.status==='Pending').reduce((a,x)=>a+x.total,0),expenses=db.expenses.reduce((a,x)=>a+x.amount,0);return `${head('Reports','At-a-glance summaries from the records in this device.',`<button class="btn" onclick="downloadCSV()">⇩ Export invoices CSV</button>`)}<div class="grid report-cards">${stat('Invoice sales',fmt(total),'↗','All recorded invoices')}${stat('Payments received',fmt(paid),'✓','Marked as paid')}${stat('Outstanding',fmt(outstanding),'◷','Marked as pending')}</div><div class="grid two-col" style="margin-top:16px"><article class="card"><div class="section-title">Sales overview</div><div class="section-sub">Invoice totals, paid amounts and expenses</div>${trend()}<div class="activity" style="margin-top:24px"><div class="activity-row"><span>Invoice sales</span><strong>${fmt(total)}</strong></div><div class="activity-row"><span>Expenses recorded</span><strong>${fmt(expenses)}</strong></div><div class="activity-row"><span>Estimated net (sales − expenses)</span><strong>${fmt(total-expenses)}</strong></div></div></article><article class="card"><div class="section-title">Stock snapshot</div><div class="section-sub">Quantity available by catalog item</div><div class="activity">${db.products.map(x=>`<div class="activity-row"><div><div class="activity-name">${esc(x.name)}</div><div class="activity-meta">${esc(x.category||'General')}</div></div><strong class="${x.stock<5?'low':''}">${x.stock} ${esc(x.unit||'pcs')}</strong></div>`).join('')}</div></article></div>`},
settings:()=>`${head('Settings & appearance','Personalize your workspace and business defaults.')}<div class="grid settings-grid"><article class="card"><div class="section-title">Business details</div><div class="section-sub">Used in your workspace and future documents</div><form onsubmit="saveBusiness(event)"><div class="form-grid"><div class="field full"><label>Business name</label><input name="name" value="${esc(db.business.name)}" required></div><div class="field"><label>Currency symbol</label><input name="currency" value="${esc(db.business.currency)}" required></div><div class="field"><label>Default tax rate (%)</label><input name="tax" type="number" min="0" max="100" value="${Number(db.business.tax)}"></div></div><button class="btn primary" style="margin-top:15px">Save business details</button></form></article><article class="card"><div class="section-title">Data & privacy</div><div class="section-sub">Your records are saved in this browser on this device.</div><div class="hint-box">This starter app uses local browser storage. Export a backup before clearing browser data or switching devices.</div><div class="quick"><button class="btn" onclick="backup()">⇩ Download backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">⇧ Restore backup</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restore(event)"></div><p style="font-size:11px;color:var(--muted)">Tax is stored as a business default; confirm local tax requirements before issuing invoices.</p></article><article class="card" style="grid-column:1/-1"><div class="section-title">Choose your interior-inspired theme</div><div class="section-sub">Soft palettes inspired by considered, welcoming spaces.</div><div class="theme-list">${[['studio','Studio Sage','#f6f5f1','#426b5b','#202d28','Quiet greens and warm neutrals'],['terracotta','Terracotta Loft','#f7f1ed','#b45e42','#3c2923','Earthy clay and natural linen'],['coastal','Coastal Calm','#eff5f5','#397d88','#203b43','Sea glass and pale stone'],['midcentury','Mid-century Oak','#f5f2e9','#9a7840','#343127','Golden wood and soft cream'],['minimal','Modern Minimal','#f5f6f7','#4b6176','#252b33','Cool, clean and understated']].map(([id,name,bg,accent,nav,desc])=>`<div class="theme-option ${db.theme===id?'selected':''}" onclick="chooseTheme('${id}')"><div class="swatches"><span class="swatch" style="background:${bg}"></span><span class="swatch" style="background:${accent}"></span><span class="swatch" style="background:${nav}"></span></div><strong>${name}</strong><small>${desc}</small></div>`).join('')}</div></article></div>`};
function greeting(){let h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening'}
const formSpec={invoice:{title:'Create invoice',kind:'Invoice'},estimate:{title:'Create estimate',kind:'Estimate'},product:{title:'Add product or service'},customer:{title:'Add customer'},supplier:{title:'Add supplier'},purchase:{title:'Record purchase'},expense:{title:'Add expense'}};
function openForm(type){let s=formSpec[type];let customers=db.customers.map(x=>`<option>${esc(x.name)}</option>`).join(''),suppliers=db.suppliers.map(x=>`<option>${esc(x.name)}</option>`).join('');let fields='';if(type==='invoice'||type==='estimate')fields=`<div class="field full"><label>Customer</label><select name="party" required>${customers}<option value="">Choose a customer…</option></select></div><div class="field"><label>Document date</label><input name="date" type="date" value="${todayISO()}" required></div><div class="field"><label>Due date</label><input name="due" type="date" value="${todayISO()}"></div><div class="field"><label>Subtotal</label><input name="subtotal" type="number" min="0" step="0.01" placeholder="0.00" required></div><div class="field"><label>Tax (%)</label><input name="tax" type="number" min="0" value="${Number(db.business.tax||0)}"></div><div class="field"><label>Status</label><select name="status"><option>Pending</option><option>Paid</option><option>Draft</option></select></div>`;
if(type==='product')fields=`<div class="field full"><label>Product or service name</label><input name="name" required></div><div class="field"><label>SKU / code</label><input name="sku"></div><div class="field"><label>Category</label><input name="category" placeholder="General"></div><div class="field"><label>Unit price</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>Unit</label><input name="unit" value="pcs"></div>`;
if(type==='customer')fields=`<div class="field full"><label>Customer / business name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" type="tel"></div><div class="field"><label>Email</label><input name="email" type="email"></div>`;
if(type==='supplier')fields=`<div class="field full"><label>Supplier name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" type="tel"></div><div class="field"><label>Opening balance</label><input name="balance" type="number" min="0" value="0"></div>`;
if(type==='purchase')fields=`<div class="field full"><label>Supplier</label><select name="party" required><option value="">Choose a supplier…</option>${suppliers}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${todayISO()}" required></div><div class="field"><label>Total amount</label><input name="total" type="number" min="0" step="0.01" required></div><div class="field"><label>Status</label><select name="status"><option>Received</option><option>Pending</option></select></div>`;
if(type==='expense')fields=`<div class="field full"><label>Description</label><input name="name" required></div><div class="field"><label>Category</label><select name="category"><option>General</option><option>Utilities</option><option>Transport</option><option>Rent</option><option>Marketing</option><option>Supplies</option><option>Other</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${todayISO()}" required></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step="0.01" required></div>`;
document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${s.title}</h2><p class="hint">Add a record to your business books.</p><form onsubmit="submitForm(event,'${type}')"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save record</button></div></form></div></div>`;if(!db.customers.length&&(type==='invoice'||type==='estimate'))toast('Add a customer first to create this document.');}
function closeModal(){document.getElementById('overlay').innerHTML=''}function submitForm(e,type){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());let id=Date.now();if(type==='invoice'||type==='estimate'){let subtotal=+d.subtotal,tax=+d.tax||0;db.invoices.unshift({id,kind:formSpec[type].kind,party:d.party,date:d.date,due:d.due,total:Math.round(subtotal*(1+tax/100)*100)/100,status:d.status})}if(type==='product')db.products.unshift({id,...d,price:+d.price,stock:+d.stock});if(type==='customer')db.customers.unshift({id,...d,balance:0});if(type==='supplier')db.suppliers.unshift({id,...d,balance:+d.balance||0});if(type==='purchase')db.purchases.unshift({id,party:d.party,date:d.date,total:+d.total,status:d.status});if(type==='expense')db.expenses.unshift({id,...d,amount:+d.amount});save();closeModal();render();toast('Saved successfully.');}
function chooseTheme(id){db.theme=id;save();setTheme();render();toast('Theme updated.')}function saveBusiness(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());db.business={name:d.name,currency:d.currency,tax:+d.tax};save();render();toast('Business details saved.')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ledgerly-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.business||!Array.isArray(x.invoices))throw Error();db=x;save();setTheme();render();toast('Backup restored.')}catch(err){toast('That backup file could not be read.')}};r.readAsText(f)}function downloadCSV(){let rows=[['Number','Type','Customer','Date','Total','Status'],...db.invoices.map(x=>[x.id,x.kind,x.party,x.date,x.total,x.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ledgerly-invoices.csv';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
